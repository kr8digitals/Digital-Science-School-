services:
  school:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATA_DIR: /app/data
      HOSTING_TARGET: hostinger-vps
      PERSISTENT_STORAGE_CONFIRMED: "true"
      TRUST_PROXY_HOPS: 1
    volumes:
      - school-data:/app/data
    expose:
      - "3000"
    read_only: true
    tmpfs:
      - /tmp
    stop_grace_period: 40s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SCHOOL_DOMAIN: ${SCHOOL_DOMAIN:?Set SCHOOL_DOMAIN to a domain you own}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      school:
        condition: service_healthy
volumes:
  school-data:
  caddy-data:
  caddy-config:
